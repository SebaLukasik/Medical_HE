[project]
name = "medical-he-stats"
version = "0.1.0"
description = "Poufna analiza danych medycznych w szyfrowaniu homomorficznym (CKKS / TenSEAL)."
readme = "README.md"
# TenSEAL 0.3.16 ma wheels do Pythona 3.13. Trzymamy 3.11 dla stabilności.
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- Rdzeń: HE ---
    "tenseal>=0.3.16",          # CKKS/BFV na bazie Microsoft SEAL

    # --- Dane / analiza ---
    "numpy>=1.26,<2.1",
    "pandas>=2.1",
    "scipy>=1.11",

    # --- API / klient-serwer ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # upload plików w FastAPI

    # --- Wizualizacja / notebooki ---
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",        # property-based testy dla PESEL
    "ruff>=0.4",                # linter/formater (opcjonalny)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # długie linie w komentarzach po polsku
